<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QA Shop</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>QA Shop</h1>
        <p>Dummy E-Commerce Application</p>
    </header>

    <main>

        <!-- PRODUCTS -->
        <section id="products">

            <h2>Products</h2>

            <div id="product-list">
                <!-- Products will be loaded from API -->
            </div>

        </section>


        <!-- SHOPPING CART -->
        <section id="cart">

            <h2>Shopping Cart</h2>

            <p id="cart-item">
                No items in cart.
            </p>

            <button type="button" id="checkout-button" disabled>
                Checkout
            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
